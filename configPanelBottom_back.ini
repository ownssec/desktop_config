[bar/bottomPanel]
monitor = ${env:MONITOR:}

width = 100%
height = 23
background = #222
bottom = true
font-0 = "JetBrainsMono Nerd Font Mono:size=7.5;1"
override-redirect = false
wm-restack = generic

modules-left = workSpaceActive xSeparator active-window 
modules-center = timeOnly
modules-right = cpu-graph xSpace cpu-info  xSeparator ram-info xSeparator disk-info xSeparator network-speed xSeparator mic-status xSeparator dateOnly

[module/workSpaceActive]
type = internal/xworkspaces

; --- Behavior ---
pin-workspaces = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

; --- Active workspace (hidden) ---
label-active = %{F#fba922}[ %name% ]%{F-}

; --- Occupied workspace (has windows but not active) ---
label-occupied = "%name%"
label-occupied-padding = 1

; --- Urgent workspace (needs attention) ---
label-urgent = "%name%"
label-urgent-background = #ff0000
label-urgent-padding = 1

; --- Empty workspace (no windows) ---
label-empty =

[module/active-window]
type = custom/script
exec = ~/.config/polybar/active-app.sh
interval = 0.5
format = <label>
label = "%output% "
label-maxlen = 100

[module/timeOnly]
type = internal/date
interval = 1.0

date = "%a"
time = %I:%M %p

label = "%{F#ffffff}%date% %{F#fba922}%time%%{F-}"
label-font = 2

[module/dateOnly]
type = internal/date
interval = 1.0

date = "%m-%d-%Y"
time = %a %I:%M %p 

label = "%{F#fba922}%date%%{F-}"
label-font = 2  # For Nerd Font icons
label-foreground = #e0e0e0

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery-status.sh
interval = 5
label = "%output%" 


[module/mic-status]
type = custom/script
exec = ~/.config/polybar/check-mic.sh
interval = 1
label-foreground = #f75252
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-right = pavucontrol

[module/network-speed]
type = custom/script
exec = ~/.config/polybar/network-speed.sh
interval = 1
label = "%output%"

click-left = sh -c 'xfce4-terminal --hold -x nmtui'
click-right = sh -c 'xfce4-terminal'

; Updated order: CPU -> Graph -> RAM -> Storage
# --- CPU: Cores / Threads (White text, Yellow label) ---
[module/cpu-info]
type = custom/script
exec = echo "%{F#fba922}Cpu:%{F-} %{F#ffffff} $(grep -m1 'cpu cores' /proc/cpuinfo | awk '{print $4}') / $(nproc)%{F-}"
interval = 999

# --- CPU Graph ---
[module/cpu-graph]
type = internal/cpu
interval = 0.5
format = <ramp-coreload>
ramp-coreload-spacing = 0
ramp-coreload-0 =  
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-0-foreground = #55aa55
ramp-coreload-4-foreground = #fba922
ramp-coreload-7-foreground = #ff5555

# --- RAM: Used / Total (Scripted for reliability) ---
[module/ram-info]
type = custom/script
; This fetches used RAM and percentage directly from the 'free' command
exec = free -h | awk '/^Mem:/ {print $3 "/" $2 " (" int($3/$2 * 100) "%)"}'
interval = 2
format-prefix = "Ram: "
format-prefix-foreground = #fba922
label-foreground = #ffffff

# --- Storage: Used / Total (Gigs) ---
[module/disk-info]
type = custom/script
; This fetches used/total for your root (/) partition in GB
exec = df -h / | awk 'NR==2 {print $3 "/" $2}'
interval = 30
format-prefix = "Disk: "
format-prefix-foreground = #fba922
label-foreground = #ffffff

# --- UI Helpers ---
[module/xSeparator]
type = custom/text
content = " :: "
content-foreground = #fff

[module/xSpace]
type = custom/text
content = " "

[module/xLeftIcon]
type = custom/text
content = %{F#fba922}|||||%{F-}
