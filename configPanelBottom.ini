[bar/bottomPanel]
monitor = ${env:MONITOR:}

width = 100%
height = 23
background = #222
bottom = true
font-0 = "JetBrainsMono Nerd Font Mono:size=7.5;1"
override-redirect = false
wm-restack = generic

; Updated order: CPU -> Graph -> RAM -> Storage
modules-center = xSpace
modules-right = cpu-graph xSpace cpu-info  xSeparator ram-info xSeparator disk-info xSpace 

# --- CPU: Cores / Threads (White text, Yellow label) ---
[module/cpu-info]
type = custom/script
exec = echo "%{F#fba922}Cpu:%{F-} %{F#ffffff} $(grep -m1 'cpu cores' /proc/cpuinfo | awk '{print $4}') / $(nproc)%{F-}"
interval = 999

# --- CPU Graph ---
[module/cpu-graph]
type = internal/cpu
interval = 0.5
format = <ramp-coreload>
ramp-coreload-spacing = 0
ramp-coreload-0 =  
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-0-foreground = #55aa55
ramp-coreload-4-foreground = #fba922
ramp-coreload-7-foreground = #ff5555

# --- RAM: Used / Total (Scripted for reliability) ---
[module/ram-info]
type = custom/script
; This fetches used RAM and percentage directly from the 'free' command
exec = free -h | awk '/^Mem:/ {print $3 "/" $2 " (" int($3/$2 * 100) "%)"}'
interval = 2
format-prefix = "Ram: "
format-prefix-foreground = #fba922
label-foreground = #ffffff

# --- Storage: Used / Total (Gigs) ---
[module/disk-info]
type = custom/script
; This fetches used/total for your root (/) partition in GB
exec = df -h / | awk 'NR==2 {print $3 "/" $2}'
interval = 30
format-prefix = "Disk: "
format-prefix-foreground = #fba922
label-foreground = #ffffff

# --- UI Helpers ---
[module/xSeparator]
type = custom/text
content = " :: "
content-foreground = #555

[module/xSpace]
type = custom/text
content = " "
